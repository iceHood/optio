# Optio — Docker Compose full stack
# Usage:
#   docker compose up -d                      # Start all services
#   docker compose up -d --scale worker=3     # Scale worker containers
#   docker compose logs -f api                # Follow API logs
#   docker compose down                       # Stop all services
#
# Prerequisites:
#   - Docker & Docker Compose v2
#   - Build images first:
#       docker build -t optio-api:latest -f Dockerfile.api .
#       docker build -t optio-web:latest -f Dockerfile.web .
#       ./images/build.sh   # builds optio-base, optio-node, etc.

services:
  # ── Infrastructure ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: optio
      POSTGRES_USER: optio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-optio_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optio"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── API Server (Fastify + BullMQ workers) ──────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: optio-api:latest
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      # Runtime
      OPTIO_RUNTIME: docker
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: "4000"
      API_HOST: "0.0.0.0"

      # Database & Cache
      DATABASE_URL: postgres://optio:${POSTGRES_PASSWORD:-optio_dev}@postgres:5432/optio
      REDIS_URL: redis://redis:6379

      # Encryption (generate with: openssl rand -hex 32)
      OPTIO_ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (openssl rand -hex 32)}

      # Auth (set to "true" to bypass auth for local dev)
      OPTIO_AUTH_DISABLED: ${OPTIO_AUTH_DISABLED:-true}

      # GitHub
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

      # OAuth (optional)
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}

      # Public URL (needed for OAuth callbacks)
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3100}

      # Agent configuration
      OPTIO_API_INTERNAL_URL: http://api:4000
      OPTIO_DOCKER_NETWORK: optio_default
      OPTIO_AGENT_IMAGE: ${OPTIO_AGENT_IMAGE:-optio-base:latest}
      OPTIO_IMAGE_PULL_POLICY: Never
      OPTIO_MAX_CONCURRENT: ${OPTIO_MAX_CONCURRENT:-5}
      OPTIO_REPO_POD_IDLE_MS: ${OPTIO_REPO_POD_IDLE_MS:-600000}

      # Claude Code auth (for claude -p headless mode)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}

      # Extra volumes to mount in worker containers (e.g., ~/.claude for claude-cli)
      OPTIO_AGENT_EXTRA_VOLUMES: ${OPTIO_AGENT_EXTRA_VOLUMES:-}
    volumes:
      # Docker socket so the API can manage worker containers
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:4000/api/health'').then(r => r.ok ? process.exit(0) : process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Web UI (Next.js dashboard) ─────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: optio-web:latest
    ports:
      - "${WEB_PORT:-3100}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_URL:-http://localhost:4000}
      INTERNAL_API_URL: http://api:4000
      OPTIO_AUTH_DISABLED: ${OPTIO_AUTH_DISABLED:-true}
    depends_on:
      api:
        condition: service_healthy

  # ── Worker (Claude Code agent container template) ──────────────────────
  # Worker containers are NOT started by docker compose directly — the API
  # server creates them on demand using the Docker API (via docker.sock).
  #
  # The API creates containers from the optio-base (or language-specific)
  # image with the appropriate environment and executes tasks via
  # `docker exec <container> bash -c "claude -p '...' --dangerously-skip-permissions"`.
  #
  # ── Claude Code Authentication Modes ──────────────────────────────────
  # Set CLAUDE_AUTH_MODE secret in the Optio UI to one of:
  #
  # 1. "api-key"          — Uses ANTHROPIC_API_KEY (pay-per-use)
  # 2. "max-subscription" — Uses CLAUDE_CODE_OAUTH_TOKEN (Pro/Max OAuth token)
  # 3. "claude-cli"       — Uses Claude Code's own auth (~/.claude/ credentials)
  #                          No API key needed — ideal for Pro/Max subscribers.
  #                          Mount ~/.claude from host into worker containers:
  #                            OPTIO_AGENT_EXTRA_VOLUMES=~/.claude:/home/agent/.claude:ro
  #                          Or pre-authenticate by running:
  #                            docker run -it optio-base:latest claude /login

volumes:
  pgdata:
